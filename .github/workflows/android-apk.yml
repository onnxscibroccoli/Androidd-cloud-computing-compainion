name: Android APK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Install Android SDK platforms
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK and compute checksum
        id: apk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.sha256
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Androidd-cloud-computing-compainion-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable test APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-${{ github.run_number }}
          name: Android physical-test build ${{ github.run_number }}
          body: |
            Automated debug APK for physical-device testing.
            This is not a production-signed release. Cloud execution remains simulation unless explicitly proven by a configured backend.
            Commit: ${{ github.sha }}
            SHA-256: ${{ steps.apk.outputs.apk_sha256 }}
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
