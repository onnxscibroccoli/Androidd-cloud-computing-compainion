name: Hybrid controller signed APK
on:
  push:
    branches: [main, 'feat/hybrid-controller-*']
    paths: ['hybrid/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['hybrid/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controller-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r hybrid/requirements-test.txt
      - run: bash hybrid/scripts/generate-proto.sh
      - run: python -m pytest hybrid/tests -q
        env:
          PYTHONPATH: hybrid
      - run: bash -n hybrid/scripts/*.sh
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          printf '%s  %s\n' 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' "$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, unit test and lint
        run: gradle -p hybrid/android --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Sign and verify release
        if: github.event_name != 'pull_request'
        env:
          SIGNING_P12_B64: ${{ secrets.CONTROLLER_SIGNING_P12_B64 }}
          SIGNING_PASSWORD: ${{ secrets.CONTROLLER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_P12_B64"
          test -n "$SIGNING_PASSWORD"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/controller.p12"' EXIT
          printf '%s' "$SIGNING_P12_B64" | base64 -d > "$RUNNER_TEMP/controller.p12"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 hybrid/android/app/build/outputs/apk/release/app-release-unsigned.apk dist/controller.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/controller.p12" --ks-type PKCS12 --ks-key-alias controller --ks-pass env:SIGNING_PASSWORD --out dist/controller.signed.apk dist/controller.apk
          mv dist/controller.signed.apk dist/controller.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/controller.apk > dist/signature-verification.txt
          (cd dist && sha256sum controller.apk > SHA256SUMS)
          printf '{"source_commit":"%s","run_id":"%s","artifact":"controller.apk","live_device_acceptance":"NOT_RUN"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: controller-signed-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: controller-build-reports
          path: hybrid/android/app/build/reports/
          if-no-files-found: warn
