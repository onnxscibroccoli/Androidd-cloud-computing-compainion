plugins { id 'com.android.application'; id 'com.google.protobuf' }
android {
    namespace 'org.broccoli.controller'
    compileSdk 35
    defaultConfig { applicationId 'org.broccoli.controller'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    buildFeatures { aidl true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { proto { srcDir '../../proto' } } }
    buildTypes { release { minifyEnabled false } }
}
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.5' }
    plugins { grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.71.0' } }
    generateProtoTasks { all().configureEach { task ->
        task.builtins { java { option 'lite' } }
        task.plugins { grpc { option 'lite' } }
    } }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'io.grpc:grpc-okhttp:1.71.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.71.0'
    implementation 'io.grpc:grpc-stub:1.71.0'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
