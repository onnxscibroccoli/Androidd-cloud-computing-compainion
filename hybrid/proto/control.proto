syntax = "proto3";
package broccoli.v1;
option java_package = "org.broccoli.controller.proto";
option java_multiple_files = true;
service Control { rpc Connect(stream DeviceEvent) returns (stream CloudEvent); }
message DeviceEvent {
  string device_id = 1;
  string boot_id = 2;
  string readiness = 3;
  Result result = 4;
  int64 time_ms = 5;
}
message Result { string job_id = 1; string state = 2; string output = 3; }
message Command {
  string job_id = 1;
  string operation = 2;
  string arguments_json = 3;
  int64 deadline_ms = 4;
}
message CloudEvent { Command command = 1; string ack_job_id = 2; }
